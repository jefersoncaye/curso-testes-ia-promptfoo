# Provider HTTP reutilizável: o ShopDemo Assistente testado como caixa-preta
id: http://localhost:3000/chat
label: assistant
config:
  method: POST
  headers:
    Content-Type: application/json
  body:
    message: '{{prompt}}'
    sessionId: '{{sessionId}}'
  transformResponse: |
    ({
      output: json.reply,
      metadata: { sources: json.context, tools: json.tools }
    })
