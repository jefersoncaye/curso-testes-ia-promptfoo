# RAG: relevância do contexto e alucinação (aula 21)
- description: Contexto encontrado para Manaus é relevante
  metadata: { type: judge }
  vars:
    question: Qual o prazo de entrega para Manaus?
    query: Qual o prazo de entrega para Manaus?
  options:
    # Prompt de avaliação próprio: com o padrão, o qwen3:8b reescreve as frases e o
    # promptfoo reprova com "Grader output does not quote the provided context".
    rubricPrompt: |
      Extract the sentences from the context below that are required to answer the query.
      Rules:
      - Copy each sentence exactly as it appears in the context, in its original language. Do not translate, rewrite, summarize or add quotes.
      - Write one sentence per line. No header, no label, no numbering, no bullets and no explanation.
      - If no sentence is relevant, write only: Insufficient Information

      query: {{query}}
      context:
      {{context}}
  assert:
    - type: context-relevance
      contextTransform: context.metadata.sources
      threshold: 0.7
      metric: rag
    - type: icontains
      value: 10 a 15
      metric: rag
    - type: not-icontains
      value: 24h
      metric: rag

- description: Prazo da região Norte vem da base, sem alucinação
  metadata: { type: judge }
  vars:
    question: Qual o prazo de entrega para Manaus?
    query: Qual o prazo de entrega para Manaus?
  options:
    # Prompt de avaliação próprio: o padrão do promptfoo 0.123.1 faz o qwen3:8b repetir
    # a linha "statements:", que é contada como uma afirmação sem veredito.
    rubricPrompt:
      - |
        Given a question and answer, create one or more statements from each sentence in the given answer.
        Write one statement per line. Output only the statements: no header, no label, no numbering and no extra text.
        question: Who was Albert Einstein and what is he best known for?
        answer: He was a German-born theoretical physicist, widely acknowledged to be one of the greatest and most influential physicists of all time. He was best known for developing the theory of relativity, he also made important contributions to the development of the theory of quantum mechanics.
        Albert Einstein was born in Germany.
        Albert Einstein was best known for his theory of relativity.
        question: Were Shahul and Jithin of the same nationality?
        answer: They were from different countries.
        Shahul and Jithin were from different countries.
        question: {{question}}
        answer: {{answer}}
      - |
        Prompt: Natural language inference
        Consider the given context and following statements, then determine whether they are supported by the information present in the context. Provide a brief explanation for each statement before arriving at the verdict (Yes/No). Provide a final verdict for each statement in order at the end in the given format. Do not deviate from the specified format.

        Context:
        John is a student at XYZ University. He is pursuing a degree in Computer Science. He is enrolled in several courses this semester, including Data Structures, Algorithms, and Database Management.
        statements:
        1. John is majoring in Biology.
        2. John is taking a course on Data Structures.
        Answer:
        1. John is majoring in Biology.
        Explanation: John's major is explicitly mentioned as Computer Science. Verdict: No.
        2. John is taking a course on Data Structures.
        Explanation: Data Structures is listed among his courses. Verdict: Yes.
        Final verdict for each statement in order: No. Yes.

        context:
        {{context}}
        statements:
        {{statements|join("\n")}}
        Answer:
  assert:
    - type: context-faithfulness
      contextTransform: context.metadata.sources
      threshold: 0.8
      metric: rag
