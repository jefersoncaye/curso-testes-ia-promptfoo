# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Contrato do classificador de intenção

prompts:
  - '{{message}}'

providers:
  - id: http://localhost:3000/classify
    label: classifier
    config:
      method: POST
      headers:
        Content-Type: application/json
      body:
        message: '{{prompt}}'
      transformResponse: text

defaultTest:
  metadata:
    type: deterministic
  assert:
    - type: is-json
      metric: format
      value:
        type: object
        required: [intent, orderId, confidence]
        properties:
          intent:
            type: string
            enum: [order_status, return, shipping, product, other]
          orderId:
            type: [string, 'null']
            pattern: '^[0-9]+$'
          confidence:
            type: number
            minimum: 0
            maximum: 1

tests:
  - description: Consulta de pedido gera JSON válido no contrato
    vars:
      message: Qual o status do pedido 4521?
    assert:
      - type: javascript
        value: JSON.parse(output).intent === 'order_status' && JSON.parse(output).orderId === '4521'

  - description: Pedido de troca é classificado como return
    vars:
      message: Quero trocar um produto que veio com defeito
    assert:
      - type: javascript
        value: JSON.parse(output).intent === 'return'

  - description: Pergunta de frete é classificada como shipping
    vars:
      message: Qual o valor do frete para Curitiba?
    assert:
      - type: javascript
        value: JSON.parse(output).intent === 'shipping'
