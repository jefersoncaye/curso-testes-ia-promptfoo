name: AI Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  deterministic:
    name: Deterministic tests (simulated mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix tests

      - name: Start ShopDemo Assistant (simulated)
        env:
          MODE: simulated
          VERSION: v2
        run: |
          cp app/.env.example app/.env
          npm start --prefix app > app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health && break; sleep 1; done

      - name: Run deterministic tests
        working-directory: tests
        env:
          PROMPTFOO_DISABLE_TELEMETRY: 1
        run: >-
          npx promptfoo eval --no-cache
          --filter-metadata type=deterministic
          -o results.junit.xml -o results.json -o report.html

      - name: Run classifier contract tests
        if: always()
        working-directory: tests
        env:
          PROMPTFOO_DISABLE_TELEMETRY: 1
        run: >-
          npx promptfoo eval --no-cache -c classifier.yaml
          -o classifier.junit.xml -o classifier.json -o classifier.html

      - name: Job summary
        if: always()
        working-directory: tests
        run: |
          node ci/summary.js results.json "Testes determinísticos (modo simulado)" "$REPORT_URL/deterministic.html"
          node ci/summary.js classifier.json "Contrato do classificador" "$REPORT_URL/classifier.html"

      - name: Test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: AI tests (deterministic)
          path: tests/*.junit.xml
          reporter: java-junit

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-report
          path: |
            tests/report.html
            tests/classifier.html

  with-ai:
    name: AI tests (Ollama on the runner)
    runs-on: ubuntu-latest
    needs: deterministic
    continue-on-error: true   # informativo até o juiz estar calibrado
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix tests

      - uses: ai-action/setup-ollama@v2

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-qwen3-4b-instruct-2507-q4_K_M-8b

      - name: Start Ollama and pull models
        run: |
          curl -sf http://localhost:11434/api/tags || (ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags && break; sleep 1; done
          ollama pull qwen3:4b-instruct-2507-q4_K_M
          ollama pull qwen3:8b

      - name: Start ShopDemo Assistant (LLM)
        env:
          MODE: llm
          VERSION: v2
          LLM_BASE_URL: http://localhost:11434/v1
          LLM_MODEL: qwen3:4b-instruct-2507-q4_K_M
          LLM_API_KEY: ollama
        run: |
          cp app/.env.example app/.env
          npm start --prefix app > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/health && break; sleep 1; done

      - name: Run judge tests (qwen3:8b from promptfooconfig.yaml)
        working-directory: tests
        env:
          PROMPTFOO_DISABLE_TELEMETRY: 1
        run: >-
          npx promptfoo eval --no-cache
          --filter-metadata type=judge
          -o results-ai.junit.xml -o results-ai.json -o report-ai.html

      - name: Job summary
        if: always()
        working-directory: tests
        run: node ci/summary.js results-ai.json "Testes com IA como juiz (modo LLM)" "$REPORT_URL/ai.html"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-report
          path: tests/report-ai.html

  publish-reports:
    name: Publish reports (GitHub Pages)
    runs-on: ubuntu-latest
    needs: [deterministic, with-ai]
    if: always() && github.ref == 'refs/heads/main' && needs.deterministic.result != 'skipped'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Build site
        run: |
          mkdir site
          cp reports/deterministic-report/report.html site/deterministic.html 2>/dev/null || true
          cp reports/deterministic-report/classifier.html site/classifier.html 2>/dev/null || true
          cp reports/ai-report/report-ai.html site/ai.html 2>/dev/null || true
          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="pt-BR">
          <head><meta charset="utf-8"><title>Relatórios de testes de IA</title></head>
          <body style="font-family: sans-serif; max-width: 640px; margin: 40px auto;">
            <h1>Relatórios de testes de IA</h1>
            <p>Execução ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7}</p>
            <ul>
              <li><a href="deterministic.html">Testes determinísticos (modo simulado)</a></li>
              <li><a href="classifier.html">Contrato do classificador</a></li>
              <li><a href="ai.html">Testes com IA como juiz (modo LLM)</a></li>
            </ul>
          </body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
