name: AI Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  deterministic:
    name: Deterministic tests (simulated mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix tests

      - name: Start ShopDemo Assistant (simulated)
        env:
          MODE: simulated
          VERSION: v2
        run: |
          cp app/.env.example app/.env
          npm start --prefix app > app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health && break; sleep 1; done

      - name: Run deterministic tests
        working-directory: tests
        env:
          PROMPTFOO_DISABLE_TELEMETRY: 1
        run: >-
          npx promptfoo eval --no-cache
          --filter-metadata type=deterministic
          -o results.junit.xml -o report.html

      - name: Run classifier contract tests
        working-directory: tests
        env:
          PROMPTFOO_DISABLE_TELEMETRY: 1
        run: npx promptfoo eval --no-cache -c classifier.yaml -o classifier.junit.xml

      - name: Test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: AI tests (deterministic)
          path: tests/*.junit.xml
          reporter: java-junit

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-report
          path: tests/report.html

  with-ai:
    name: AI tests (Ollama on the runner)
    runs-on: ubuntu-latest
    needs: deterministic
    continue-on-error: true   # informativo até o juiz estar calibrado
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix tests

      - uses: ai-action/setup-ollama@v2

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-qwen3-4b-instruct-2507-q4_K_M-8b

      - name: Start Ollama and pull models
        run: |
          curl -sf http://localhost:11434/api/tags || (ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags && break; sleep 1; done
          ollama pull qwen3:4b-instruct-2507-q4_K_M
          ollama pull qwen3:8b

      - name: Start ShopDemo Assistant (LLM)
        env:
          MODE: llm
          VERSION: v2
          LLM_BASE_URL: http://localhost:11434/v1
          LLM_MODEL: qwen3:4b-instruct-2507-q4_K_M
          LLM_API_KEY: ollama
        run: |
          cp app/.env.example app/.env
          npm start --prefix app > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/health && break; sleep 1; done

      - name: Run judge tests (qwen3:8b from promptfooconfig.yaml)
        working-directory: tests
        env:
          PROMPTFOO_DISABLE_TELEMETRY: 1
        run: >-
          npx promptfoo eval --no-cache
          --filter-metadata type=judge
          -o results-ai.junit.xml -o report-ai.html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-report
          path: tests/report-ai.html
