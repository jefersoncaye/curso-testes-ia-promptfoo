<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopDemo Assistente</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1d2330; --muted: #6b7280; --border: #e3e6eb;
    --brand: #2f5bd3; --brand-text: #ffffff; --bot: #eef1f6; --warn: #b45309; --warn-bg: #fff7e6;
    --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11141a; --panel: #1a1e26; --text: #e6e8ec; --muted: #9aa3b2; --border: #2a303b;
      --brand: #4f7cf0; --bot: #232834; --warn: #f2b45a; --warn-bg: #2c2416; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { max-width: 820px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 16px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font: 12px var(--mono); padding: 3px 8px; border-radius: 6px; background: var(--panel); border: 1px solid var(--border); color: var(--muted); }
  .badge.v1 { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
  .controls { display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--muted); }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 6px 12px; }
  button.primary { background: var(--brand); color: var(--brand-text); border-color: var(--brand); padding: 10px 18px; }
  button:disabled { opacity: .6; cursor: default; }
  #messages { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--brand); color: var(--brand-text); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .error { align-self: flex-start; background: var(--warn-bg); color: var(--warn); }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  details { margin-top: 8px; font-size: 13px; }
  details summary { cursor: pointer; color: var(--muted); }
  details pre { font: 12px var(--mono); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px; overflow-x: auto; white-space: pre-wrap; margin: 6px 0 0; }
  .hide-details details { display: none; }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 420px; }
  .empty button { margin: 4px; font-size: 13px; }
  form { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid var(--border); }
  textarea { flex: 1; resize: none; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); min-height: 46px; max-height: 160px; }
  textarea:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>ShopDemo Assistente</h1>
    <div class="badges" id="badges"><span class="badge">conectando...</span></div>
    <div class="controls">
      <label><input type="checkbox" id="showDetails" checked> Mostrar contexto e ferramentas</label>
      <button id="newChat" type="button">Nova conversa</button>
    </div>
  </header>

  <div id="messages">
    <div class="empty" id="empty">
      <p>Converse com o assistente de suporte da loja ShopDemo. Algumas perguntas para começar:</p>
      <div>
        <button type="button" data-q="Quais formas de pagamento vocês aceitam?">Formas de pagamento</button>
        <button type="button" data-q="Qual o prazo de entrega para Manaus?">Prazo para Manaus</button>
        <button type="button" data-q="Qual o status do pedido 4521?">Pedido 4521</button>
        <button type="button" data-q="Consegue um desconto para eu fechar a compra hoje?">Pedir desconto</button>
      </div>
    </div>
  </div>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Digite sua mensagem (Enter envia, Shift+Enter quebra linha)" required></textarea>
    <button class="primary" id="send" type="submit">Enviar</button>
  </form>
</div>

<script>
  const messages = document.getElementById('messages');
  const input = document.getElementById('input');
  const sendButton = document.getElementById('send');
  let sessionId = crypto.randomUUID();

  async function loadHealth() {
    try {
      const h = await (await fetch('/health')).json();
      document.getElementById('badges').innerHTML =
        `<span class="badge">modo ${h.mode}</span>` +
        `<span class="badge ${h.version === 'v1' ? 'v1' : ''}">versão ${h.version}${h.version === 'v1' ? ' (com bugs)' : ''}</span>` +
        `<span class="badge">${h.model}</span>`;
    } catch {
      document.getElementById('badges').innerHTML = '<span class="badge v1">app fora do ar</span>';
    }
  }

  function add(className, text) {
    document.getElementById('empty')?.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + className;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function addDetails(div, title, value) {
    const d = document.createElement('details');
    const s = document.createElement('summary');
    s.textContent = title;
    const pre = document.createElement('pre');
    pre.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
    d.append(s, pre);
    div.appendChild(d);
  }

  async function send(text) {
    add('user', text);
    sendButton.disabled = true;
    const waiting = add('bot', 'Digitando...');
    const started = performance.now();
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, sessionId }),
      });
      const data = await res.json();
      waiting.remove();
      if (!res.ok) return add('error', data.error || `Erro ${res.status}`);
      const div = add('bot', data.reply);
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `${Math.round(performance.now() - started)} ms`;
      div.appendChild(meta);
      addDetails(div, `Contexto encontrado (${data.context.length})`, data.context.length ? data.context.map((c) => '- ' + c).join('\n') : 'Nenhum trecho encontrado');
      if (data.tools.length) addDetails(div, `Ferramentas chamadas (${data.tools.length})`, data.tools);
    } catch (error) {
      waiting.remove();
      add('error', 'Não foi possível falar com o app: ' + error.message);
    } finally {
      sendButton.disabled = false;
      input.focus();
    }
  }

  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    send(text);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.getElementById('form').requestSubmit();
    }
  });

  document.querySelectorAll('[data-q]').forEach((b) => b.addEventListener('click', () => send(b.dataset.q)));

  document.getElementById('showDetails').addEventListener('change', (e) => {
    messages.classList.toggle('hide-details', !e.target.checked);
  });

  document.getElementById('newChat').addEventListener('click', () => {
    sessionId = crypto.randomUUID();
    messages.innerHTML = '';
    add('bot', 'Nova conversa iniciada. O assistente não lembra das mensagens anteriores.');
  });

  loadHealth();
  input.focus();
</script>
</body>
</html>
